# 外部检索工具配置
# 控制 Round 3 的外部搜索行为

# 是否启用外部检索
enabled: true

# 每个工具最多返回的证据条数
max_results_per_tool: 2

# 单次工具调用超时（秒）
timeout: 10

# 工具列表（按列表顺序依次遍历执行）
tools:
  - name: pubmed
    enabled: false
    query_template: "{missing_slot}"
    api_key: ""       # PubMed E-utilities 无需 key（可选填 NCBI API key 提升速率限制）
    endpoint: ""

  - name: bing_search
    enabled: false
    query_template: "{missing_slot}"
    api_key: ""       # 需填入 Bing Search API key（Azure 认知服务）
    endpoint: "https://api.bing.microsoft.com/v7.0/search"

  - name: baidu_search
    enabled: true     # 无需 api_key，依赖 beautifulsoup4
    query_template: "{missing_slot}"
    api_key: ""
    endpoint: ""
